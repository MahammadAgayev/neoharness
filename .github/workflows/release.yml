# A tag v* makes a GitHub release: the CLI for macOS, Linux and Windows, and
# the macOS app for Apple silicon and Intel. The app is signed ad hoc, not
# notarized; the README says how to open it the first time.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: ./check.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm test
        working-directory: desktop

  cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: build
        run: |
          mkdir -p out
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name=neoharness-$GITHUB_REF_NAME-$os-$arch
            exe=neoharness
            [ "$os" = windows ] && exe=neoharness.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "build/$name/$exe" ./cmd/neoharness
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../out/$name.zip" "$name")
            else
              tar -C build -czf "out/$name.tar.gz" "$name"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/*

  app:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: build
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm run build
          npm run package:app -- --arch=${{ matrix.arch }}
          app=dist/neoharness-darwin-${{ matrix.arch }}/neoharness.app
          codesign --force --deep --sign - "$app"
          mkdir -p ../out
          ditto -c -k --keepParent "$app" "../out/neoharness-$GITHUB_REF_NAME-mac-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: out/*

  release:
    needs: [cli, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > checksums.txt
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes *
